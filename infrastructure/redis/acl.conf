# Redis ACL Configuration
# Location: infrastructure/redis/acl.conf
# This file defines per-service Redis users. Load via: --aclfile /etc/redis/acl.conf

# ============================================================
# DISABLE the default user — required in production
# ============================================================
user default off nopass nocommands

# ============================================================
# API Service User
# Permissions: cache:*, rl:* (rate limits), session:*
# Denied: all dangerous admin commands
# ============================================================
user api-service on >REPLACE_WITH_STRONG_PASSWORD
  ~cache:*
  ~rl:*
  ~session:*
  +GET +SET +DEL +EXPIRE +TTL +PTTL +EXISTS
  +INCR +INCRBY +DECR +DECRBY
  +ZADD +ZRANGE +ZRANGEBYSCORE +ZREM +ZSCORE +ZCARD
  +SETNX +GETSET +MGET
  +PING +HELLO
  -DEBUG -FLUSHALL -FLUSHDB -CONFIG -ACL -MODULE -SHUTDOWN
  -SLAVEOF -REPLICAOF -BGREWRITEAOF -BGSAVE -SAVE
  -KEYS -SCAN -HSCAN -SSCAN -ZSCAN

# ============================================================
# AI Worker User
# Permissions: queue:ai-generation:* only
# ============================================================
user ai-worker on >REPLACE_WITH_STRONG_PASSWORD
  ~queue:ai-generation:*
  ~bull:ai-generation:*
  +BRPOP +RPUSH +LPUSH +LPOP +LRANGE +LLEN +LREM
  +GET +SET +DEL +EXPIRE +TTL +EXISTS
  +ZADD +ZRANGE +ZRANGEBYSCORE +ZREM +ZSCORE +ZCARD
  +SETNX +INCR
  +PING +HELLO
  -DEBUG -FLUSHALL -FLUSHDB -CONFIG -ACL -MODULE -SHUTDOWN

