# Read-only Monitoring User (for dashboards / alerting)
# ============================================================
user monitoring on >REPLACE_WITH_STRONG_PASSWORD
  ~*
  +INFO +DBSIZE +SLOWLOG +MEMORY +PING
  -DEBUG -FLUSHALL -FLUSHDB -CONFIG SET -ACL -MODULE -SHUTDOWN
