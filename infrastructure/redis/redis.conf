# Redis Production Configuration
# Location: infrastructure/redis/redis.conf
# Reference: https://redis.io/docs/management/config/

# ============================================================
# Network — never expose Redis publicly
# ============================================================
bind 127.0.0.1 10.0.0.0/8   # bind to loopback + private network only
protected-mode yes
port 0                        # disable plaintext port in production
tls-port 6379

# ============================================================
# TLS — mandatory in staging and production
# ============================================================
tls-cert-file /etc/redis/tls/redis.crt
tls-key-file /etc/redis/tls/redis.key
tls-ca-cert-file /etc/redis/tls/ca.crt
tls-auth-clients no           # set to 'yes' to require client certs (mTLS)
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"

# ============================================================
# Authentication — use ACL file, not legacy requirepass
# ============================================================
aclfile /etc/redis/acl.conf

# ============================================================
# Memory — set maxmemory and eviction policy
# Queue Redis: noeviction (queue data must NEVER be evicted)
# Cache Redis: allkeys-lru (safe to evict cached metadata)
# ============================================================
maxmemory 2gb
maxmemory-policy noeviction   # for queue Redis instance
# maxmemory-policy allkeys-lru # uncomment for cache Redis instance

# ============================================================
# Connection limits
# ============================================================
maxclients 500
timeout 300          # disconnect idle clients after 5 minutes
tcp-keepalive 60

# ============================================================
# Persistence — Queue Redis: AOF for durability
# ============================================================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ============================================================
# Snapshots — optional secondary backup
# ============================================================
save 900 1
save 300 10
save 60 10000

# ============================================================
# Slow log — for performance monitoring
# ============================================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ============================================================
# Disable RESP2 DEBUG command
# ============================================================
rename-command DEBUG ""
rename-command CONFIG ""

# NOTE: Command restriction via rename-command is NOT the primary
# security mechanism. Use ACL users defined in acl.conf.
# rename-command alone can be circumvented. ACLs are authoritative.
